; ==================== ESP8266 NODEMCU V3 (AKTIF) ====================
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit Unified Sensor@^1.1.4
	adafruit/Adafruit INA219@^1.2.0
	claws/BH1750@^1.3.0
	tzapu/WiFiManager@^2.0.17
